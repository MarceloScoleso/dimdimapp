{% extends "base.html" %}
{% block title %}{{ acao }} Cliente | DimDimApp{% endblock %}

{% block content %}
    <h2>{{ acao }} Cliente</h2>

    <form method="POST">
        <div>
            <label for="nome">Nome completo</label>
            <input type="text" id="nome" name="nome" required
                   value="{{ cliente.nome if cliente else '' }}"
                   placeholder="Ex: João da Silva">
        </div>

        <div>
            <label for="cpf">CPF</label>
            <input type="text" id="cpf" name="cpf" required
                   value="{{ cliente.cpf if cliente else '' }}"
                   placeholder="Ex: 123.456.789-00" maxlength="14">
        </div>

        <div>
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" required
                   value="{{ cliente.email if cliente else '' }}"
                   placeholder="Ex: cliente@email.com">
        </div>

        <div>
            <label for="saldo">Saldo inicial (R$)</label>
            <input type="number" id="saldo" name="saldo" step="0.01" min="0"
                   value="{{ cliente.saldo if cliente else '0.00' }}"
                   placeholder="0.00">
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Salvar</button>
            <a href="{{ url_for('index') }}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
{% endblock %}
